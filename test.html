<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Assessment | Mathora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="form-page">
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">
        <span class="brand-mark">
          <span class="mark-letter">M</span>
          <span class="mark-root">√</span>
        </span>
        <span class="brand-name">MATHORA</span>
      </a>
      <span class="test-header-label">Diagnostic assessment</span>

  <main class="registration-main">

        <p class="section-kicker">Registration successful</p>
        <h1 id="welcome-title">Your assessment is ready.</h1>

        <div class="saved-details" id="saved-details"></div>

        <div class="placeholder-notice">
          <strong>Next stage</strong>
          <p>
            We will now replace this page with the 12-question assessment,

          </p>

        <a class="button button-secondary" href="register.html">Edit registration details</a>

    </div>

  <script src="test.js"></script>
